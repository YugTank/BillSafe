spring:
  application:
    name: billsafe

  datasource:
    url: jdbc:postgresql://${DB_HOST:host.docker.internal}:${DB_PORT:5432}/${DB_NAME:billsafe}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    default-schema: public
    schema:
      -public
      -auth
      -purchase
      -notification
      -analytics
  jwt:
    secret: 4jVh5i5GHR7piL6sjcOgjBbI9MqTWKDlmjFJEmXKdN5
    expiration: 86400000
  logging:
    level:
      org.springframework.security: DEBUG

  file:
    upload-dir: uploads

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer